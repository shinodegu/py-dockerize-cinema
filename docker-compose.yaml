services:
   cinema_service:
       build:
           context: .
       ports:
           - "8001:8000"
       volumes:
         - ./:/app
       command: >
           sh -c "python manage.py migrate &&
                     python manage.py runserver 0.0.0.0:8000"
       env_file:
           - .env
       depends_on:
         db:
           condition: service_healthy

   db:
       image: postgres:16.0-alpine3.17
       restart: always
       ports:
           - "5432:5432"
       env_file:
           - .env
       healthcheck:
         test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER  -d $POSTGRES_DB" ]
         interval: 5s
         timeout: 5s
         retries: 5
       volumes:
         - my_db:$PGDATA

volumes:
  my_db:
